name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domofon-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build -- --base=/Samokat_map/
        env:
          # publishable-ключ Supabase публичный по замыслу; данные защищает RLS
          VITE_SUPABASE_URL: https://jaskogcjhnuxrnjjnjdm.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ipZ_Ht1pJmBgME0upkhTBw_THFNTGA_
          VITE_2GIS_KEY: ${{ secrets.TWOGIS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: domofon-map/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4